<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งงาน YouTube</title>
    <style>
        body { 
            font-family: 'Tahoma', sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;

            /* --- ใส่ลิงก์รูปภาพของคุณที่นี่ (ต้องขึ้นต้นด้วย https://) --- */
            background-image: url('https://scontent.fbkk25-1.fna.fbcdn.net/v/t1.15752-9/626789124_1486551332994234_1024182792052471222_n.jpg?_nc_cat=104&ccb=1-7&_nc_sid=9f807c&_nc_ohc=S1i_ughRbJ4Q7kNvwHpKQtB&_nc_oc=Adk0wZcjqmRo7kKvOGq5aSPQSRRTi2YTMlg4EtSPSllPh6bwsATgTomVrIuZQHIyRq5kQYUlLEIYq0qkrGXYtRG-&_nc_zt=23&_nc_ht=scontent.fbkk25-1.fna&oh=03_Q7cD4gHfiaiL6nfVdppyyvx0yFk-u8mCNZRHGHKQaOfj-UYthA&oe=69C7B24B'), 
                              url('https://scontent.fbkk25-1.fna.fbcdn.net/v/t1.15752-9/624007086_3542156775931850_3640748888963490407_n.jpg?_nc_cat=106&ccb=1-7&_nc_sid=9f807c&_nc_ohc=vhW_Swhhb44Q7kNvwF65T7R&_nc_oc=Adl2RWo3q4LRerF1iCZ0jLtWkS9Zx7Y31C0t3CrRIOsmeqMEoMkE6DcdoLBKVJjkHwqd2zSBL8vCoI4uRNVOQuhb&_nc_zt=23&_nc_ht=scontent.fbkk25-1.fna&oh=03_Q7cD4gEsqBCvql3zsHJcc4ON_ZAktzkTqV6pJbhWPHX5oaqO8g&oe=69C7C505');
            
            /* ตั้งค่าให้รูปอยู่ซ้าย-ล่าง และ ขวา-ล่าง ของจอ */
            background-position: left 2% bottom 2%, right 2% bottom 2%; 
            background-repeat: no-repeat;
            
            /* ปรับขนาดรูปให้ขึ้นในโทรศัพท์ (25vw คือ 25% ของความกว้างจอ) */
            background-size: 50vw; 
            background-attachment: fixed;
        }

        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 85%; 
            max-width: 380px;
            position: relative;
            z-index: 10;
        }

        h2 { color: #ff0000; text-align: center; margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #ff0000; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
        }
        #message { text-align: center; margin-top: 15px; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 ส่งงาน YouTube</h2>
    <form id="submission-form">
        <label>เลขที่</label>
        <input type="number" name="studentNo" placeholder="ตัวอย่าง: 10" required>

        <label>ชื่อ-นามสกุล</label>
        <input type="text" name="name" placeholder="ชื่อของออเจ้า" required>

        <label>ลิงก์ YouTube</label>
        <input type="url" name="youtubeLink" placeholder="https://..." required>

        <button type="submit" id="submit-btn">ส่งข้อมูล</button>
    </form>
    <div id="message"></div>
</div>

<script>
    // วางลิงก์ Web App URL ที่ได้จาก Google Apps Script
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyCFNW9gRu40WXcOgmGFJHBzfak-rGgh8PKp3FT-p6bmxyiUoDqN3SApZv6hu3A63gb5Q/exec';
    const form = document.getElementById('submission-form');
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('message');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        msg.style.display = 'block';
        msg.style.color = 'blue';
        msg.innerText = '⏳ น้องเปี๊ยกคนหล่อ...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                alert('เด็กเอ๋อส่งงานแล้วว6 7!');
                msg.innerText = '✅ ส่งแล้วจร้าา';
                msg.style.color = 'green';
                btn.disabled = false;
                form.reset();
            })
            .catch(error => {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
                btn.disabled = false;
                msg.innerText = '❌ เกิดข้อผิดพลาด';
                msg.style.color = 'red';
            });
    });
</script>

</body>
</html>
