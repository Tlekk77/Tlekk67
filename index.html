<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งงาน YouTube</title>
    <style>
        :root { --primary-color: #ff0000; --bg-color: #f4f4f9; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;

            /* --- ใส่ลิงก์รูปภาพของคุณตรงนี้ --- */
            background-image: url('ใส่ลิงก์รูปซ้าย'), url('ใส่ลิงก์รูปขวา');
            background-position: left center, right center;
            background-repeat: no-repeat;
            background-size: 15%; /* ปรับขนาดรูปซ้ายขวาตรงนี้ */
            background-attachment: fixed;
        }

        /* ซ่อนรูปพื้นหลังเมื่อเปิดในมือถือเพื่อไม่ให้ทับฟอร์ม */
        @media (max-width: 800px) {
            body { background-image: none; }
        }

        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 2rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px;
            z-index: 10;
        }

        h2 { color: var(--primary-color); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #message { text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 ส่งงาน YouTube</h2>
    <form id="submission-form">
        <input type="number" name="studentNo" placeholder="เลขที่" required>
        <input type="text" name="name" placeholder="ชื่อ-นามสกุล" required>
        <input type="url" name="youtubeLink" placeholder="ลิงก์ YouTube" required>
        <button type="submit" id="submit-btn">ส่งข้อมูล</button>
    </form>
    <div id="message"></div>
</div>

<script>
    // อย่าลืมเอาลิงก์จาก New Deployment มาวางตรงนี้
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxLgfYY8OWNaxwhtjMRUA56ddI_J5xctZDA-as0zCPF-j1AZ84oZjRE8ltua7C6nRiBdQ/exec';
    const form = document.getElementById('submission-form');
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('message');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        msg.style.display = 'block';
        msg.innerText = '⏳ กำลังบันทึกตามเลขที่...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                alert('ส่งงานเรียบร้อย! ข้อมูลจะไปอยู่ที่แถวตามเลขที่ของคุณ');
                msg.innerText = '✅ บันทึกสำเร็จ!';
                btn.disabled = false;
                form.reset();
            })
            .catch(error => {
                alert('เกิดข้อผิดพลาด');
                btn.disabled = false;
            });
    });
</script>

</body>
</html>
