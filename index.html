<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งงานวิดีโอ YouTube</title>
    <style>
        :root { --primary-color: #ff0000; --bg-color: #f4f4f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; padding-bottom: 3rem; }
        h2 { color: var(--primary-color); text-align: center; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 12px; margin-bottom: 1.2rem; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #cc0000; }
        #message { text-align: center; margin-top: 1rem; font-size: 14px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 ส่งงาน YouTube</h2>
    <form id="submission-form">
        <label>เลขที่</label>
        <input type="number" name="studentNo" placeholder="ระบุเลขที่ของคุณ" required>

        <label>ชื่อ-นามสกุล</label>
        <input type="text" name="name" placeholder="ระบุชื่อ-นามสกุล" required>

        <label>ลิงก์ YouTube</label>
        <input type="url" name="youtubeLink" placeholder="https://www.youtube.com/watch?v=..." required>

        <button type="submit" id="submit-btn">ส่งข้อมูล</button>
    </form>
    <div id="message"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbw05mS6yUs5tltvTVSANTCm_pVdymi8juozePi4bmT7i2JLXOqteJ73eWWPNDTqXyFQ/exec';
    const form = document.getElementById('submission-form');
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('message');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = 'กำลังส่ง...';
        msg.style.display = 'block';
        msg.style.color = 'blue';
        msg.innerText = '⏳ ระบบกำลังบันทึกลง Google Sheets...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                alert('ส่งงานเรียบร้อยแล้ว! ขอบคุณครับ');
                msg.innerText = '✅ บันทึกสำเร็จ!';
                msg.style.color = 'green';
                btn.disabled = false;
                btn.innerText = 'ส่งข้อมูล';
                form.reset();
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('เกิดข้อผิดพลาด กรุณาลองใหม่');
                btn.disabled = false;
                btn.innerText = 'ส่งข้อมูล';
                msg.innerText = '❌ เกิดข้อผิดพลาด';
                msg.style.color = 'red';
            });
    });
</script>

</body>
</html>
